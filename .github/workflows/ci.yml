name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to verify
        required: false
        type: string

permissions:
  contents: read

env:
  LIBMAGIC_VERSION: 5.48

jobs:
  natives-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 22
          cache: maven
      - name: Fetch source
        run: |
          mkdir -p build
          curl -sfL "https://www.astron.com/pub/file/file-${LIBMAGIC_VERSION}.tar.gz" | tar xz -C build
      - name: Build natives
        run: build-natives/macos-arm64.sh
      - name: Test
        run: mvn -B clean install
      - uses: actions/upload-artifact@v4
        with:
          name: natives-macos-arm64
          path: natives/src/main/resources/natives/macos-arm64/
          if-no-files-found: error

  natives-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 22
          cache: maven
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-bzip2
            mingw-w64-x86_64-xz
            mingw-w64-x86_64-libsystre
            mingw-w64-x86_64-libtre
            mingw-w64-x86_64-gettext-runtime
            mingw-w64-x86_64-libiconv
            make
            patch
            curl
      - name: Fetch source
        run: |
          mkdir -p build
          curl -sfL "https://www.astron.com/pub/file/file-${LIBMAGIC_VERSION}.tar.gz" | tar xz -C build
      - name: Build natives
        run: build-natives/windows-x64.sh
      - name: Test
        shell: pwsh
        run: mvn -B clean install
      - uses: actions/upload-artifact@v4
        with:
          name: natives-windows-x64
          path: natives/src/main/resources/natives/windows-x64/
          if-no-files-found: error

  natives-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 22
          cache: maven
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential zlib1g-dev libbz2-dev liblzma-dev patchelf
      - name: Fetch source
        run: |
          mkdir -p build
          curl -sfL "https://www.astron.com/pub/file/file-${LIBMAGIC_VERSION}.tar.gz" | tar xz -C build
      - name: Build natives
        run: build-natives/linux-x64.sh
      - name: Test
        run: mvn -B clean install
      - uses: actions/upload-artifact@v4
        with:
          name: natives-linux-x64
          path: natives/src/main/resources/natives/linux-x64/
          if-no-files-found: error
